<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PatrimonioMC - Simulador Financiero Estocástico</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar de Parámetros Globales -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>PatrimonioMC</h2>
                <p>Simulador Monte Carlo</p>
            </div>
            
            <div class="presets-container">
                <button class="preset-btn" data-preset="emergency">Fondo Emergencia 2 años</button>
                <button class="preset-btn" data-preset="auto">Meta Equipo/Auto 5 años</button>
                <button class="preset-btn" data-preset="wealth">Patrimonio 15 años</button>
            </div>

            <form id="params-form">
                <div class="input-group">
                    <label for="capital">Capital Inicial ($)</label>
                    <input type="number" id="capital" value="10000" step="100" required>
                </div>
                <div class="input-group">
                    <label for="monthly-contrib">Aportación Mensual ($)</label>
                    <input type="number" id="monthly-contrib" value="2000" step="100" required>
                </div>
                <div class="input-group">
                    <label for="target">Meta en Valor Real ($)</label>
                    <input type="number" id="target" value="150000" step="1000" required>
                </div>
                <div class="input-group">
                    <label for="horizon">Horizonte (Años, 1-30)</label>
                    <input type="number" id="horizon" value="5" min="1" max="30" required>
                </div>
                <div class="input-group">
                    <label for="inflation">Inflación Anual Estimada (%)</label>
                    <input type="number" id="inflation" value="4.0" step="0.1" required>
                </div>
                <div class="input-group">
                    <label for="volatility">Volatilidad Anual (%)</label>
                    <input type="number" id="volatility" value="10.0" step="0.1" required>
                </div>
                <div class="input-group">
                    <label for="risk-miss">Probabilidad Mes sin Aporte (%)</label>
                    <input type="number" id="risk-miss" value="5.0" step="0.1" required>
                </div>
                <div class="input-group">
                    <label>Tasas Anuales Instrumentos (%)</label>
                    <div class="rates-inputs">
                        <input type="number" id="rate-cons" value="4.5" step="0.1" title="Conservador">
                        <input type="number" id="rate-fixed" value="9.5" step="0.1" title="Renta Fija">
                        <input type="number" id="rate-growth" value="12.5" step="0.1" title="Crecimiento">
                    </div>
                </div>
                
                <button type="submit" class="primary-btn">Ejecutar Simulación</button>
            </form>
        </aside>

        <!-- Área Principal de Resultados -->
        <main class="main-content">
            <header class="content-header">
                <div class="tabs">
                    <button class="tab-btn active" data-target="tab-deterministic">1. Vista Clásica Determinista</button>
                    <button class="tab-btn" data-target="tab-montecarlo">2. Vista Monte Carlo Estocástica</button>
                </div>
                <div class="export-actions">
                    <button id="export-csv">📥 CSV</button>
                    <button id="export-json">📥 JSON</button>
                </div>
            </header>

            <!-- Pestaña Determinista -->
            <section id="tab-deterministic" class="tab-pane active">
                <div class="cards-grid" id="cards-deterministic">
                    <!-- Tarjetas inyectadas via JS -->
                </div>
                <div class="chart-container">
                    <canvas id="canvas-deterministic"></canvas>
                </div>
                <div class="table-container">
                    <table id="table-deterministic">
                        <thead>
                            <tr>
                                <th>Año</th>
                                <th>Aportado Nominal</th>
                                <th>Conservador (Real)</th>
                                <th>Renta Fija (Real)</th>
                                <th>Crecimiento (Real)</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>

            <!-- Pestaña Monte Carlo -->
            <section id="tab-montecarlo" class="tab-pane">
                <div class="mc-summary" id="mc-summary">
                    <!-- Resumen inyectado via JS -->
                </div>
                <div class="chart-container mc-chart">
                    <canvas id="canvas-montecarlo"></canvas>
                </div>
                <div class="mc-optimization" id="mc-optimization">
                    <!-- Búsqueda binaria inyectada via JS -->
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
